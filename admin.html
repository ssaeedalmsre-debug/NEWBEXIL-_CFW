<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>لوحة التحكم - NEW PIXEL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{font-family:'Cairo',sans-serif;margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;min-height:100vh;padding:20px}
.box{background:rgba(20,20,20,0.95);border:2px solid rgba(212,175,55,0.3);border-radius:20px;padding:25px;max-width:900px;width:100%;margin:0 auto}
h1{color:#d4af37;text-align:center;margin-bottom:20px;font-size:1.8rem}
h2{color:#d4af37;text-align:center;margin:25px 0 15px;font-size:1.3rem;border-bottom:1px solid rgba(212,175,55,0.2);padding-bottom:10px}
input,textarea{width:100%;background:rgba(255,255,255,0.03);border:2px solid rgba(212,175,55,0.2);border-radius:10px;padding:10px;color:#e0e0e0;font-size:0.95rem;margin-bottom:10px;font-family:'Cairo',sans-serif}
input:focus,textarea:focus{border-color:#d4af37;outline:none}
button{background:#d4af37;color:#0a0a0a;border:none;padding:10px 25px;border-radius:10px;font-weight:700;cursor:pointer;font-size:0.95rem;transition:.3s;margin:5px 0}
button:hover{background:#c4a032;transform:scale(1.02)}
.btn-on{background:#00cc44;color:#fff}
.btn-off{background:#ff4444;color:#fff}
.btn-small{padding:6px 15px;font-size:0.85rem}
.card{background:rgba(20,20,20,0.8);border:1px solid rgba(212,175,55,0.2);border-radius:12px;padding:15px;margin-bottom:12px}
.card-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.card-header h3{color:#d4af37;font-size:1.1rem}
.status{font-size:0.8rem;font-weight:700;padding:3px 10px;border-radius:20px}
.status.open{background:#00cc44;color:#fff}
.status.closed{background:#ff4444;color:#fff}
label{display:block;color:#d4af37;font-weight:700;font-size:0.85rem;margin-top:10px;margin-bottom:5px}
.hidden{display:none}
.msg{text-align:center;padding:12px;border-radius:10px;margin-bottom:15px;font-weight:700;font-size:0.9rem}
.msg.success{background:rgba(0,204,68,0.2);color:#00cc44;border:1px solid #00cc44}
.msg.error{background:rgba(255,68,68,0.2);color:#ff4444;border:1px solid #ff4444}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.tabs button{background:rgba(255,255,255,0.05);color:#9e9e9e;border:2px solid rgba(212,175,55,0.1)}
.tabs button.active{background:#d4af37;color:#0a0a0a}
.tab-content{display:none}
.tab-content.active{display:block}
</style>
</head>
<body>
<div class="box">
<h1>🔐 لوحة التحكم - NEW PIXEL</h1>

<div id="loginScreen">
<div id="loginMsg"></div>
<input type="password" id="passwordInput" placeholder="أدخل كلمة المرور">
<button onclick="checkPassword()" style="width:100%">دخول</button>
</div>

<div id="adminPanel" class="hidden">
<div id="panelMsg"></div>

<div class="tabs">
<button onclick="showTab('main')" id="tabMain" class="active">الرئيسية</button>
<button onclick="showTab('ministries')" id="tabMinistries">الوزارات</button>
<button onclick="showTab('products')" id="tabProducts">المنتجات</button>
<button onclick="showTab('webhooks')" id="tabWebhooks">Webhooks</button>
</div>

<div id="contentMain" class="tab-content active">
<h2>⚙️ إعدادات الموقع</h2>
<label>الصورة الرئيسية (رابط)</label>
<input type="text" id="mainImage" placeholder="https://...">
<label>حالة المتجر</label>
<button onclick="toggleStore()" id="storeBtn" style="width:100%">جاري التحميل...</button>
<button onclick="saveMainSettings()" style="width:100%;margin-top:15px">💾 حفظ إعدادات الموقع</button>
</div>

<div id="contentMinistries" class="tab-content">
<h2>🏛️ الوزارات</h2>
<div id="ministriesList"></div>
</div>

<div id="contentProducts" class="tab-content">
<h2>🛍️ المنتجات</h2>
<div id="productsList"></div>
</div>

<div id="contentWebhooks" class="tab-content">
<h2>🔗 Webhooks</h2>
<label>Webhook المتجر</label>
<input type="text" id="storeWebhook" placeholder="https://discord.com/api/webhooks/...">
<div id="ministryWebhooksList"></div>
<button onclick="saveWebhooks()" style="width:100%;margin-top:15px">💾 حفظ Webhooks</button>
</div>

</div>
</div>

<script>
const PASSWORD='almshri_saeed909';
const GITHUB_USER='ssaeedalmsre-debug';
const GITHUB_REPO='NEWBEXIL-_CFW';
const DATA_FILE='data.json';
let githubToken='';
let currentData=null;

function showMsg(id,text,type){
const el=document.getElementById(id);
el.innerHTML='<div class="msg '+type+'">'+text+'</div>';
setTimeout(()=>el.innerHTML='',3000);
}

function showTab(tab){
document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
document.getElementById('content'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
}

function checkPassword(){
const p=document.getElementById('passwordInput').value;
if(p!==PASSWORD){showMsg('loginMsg','❌ كلمة المرور خاطئة','error');return;}
if(!githubToken){
githubToken=prompt('أدخل GitHub Token:');
if(!githubToken){showMsg('loginMsg','❌ يجب إدخال التوكن','error');return;}
localStorage.setItem('gh_token',githubToken);
}
document.getElementById('loginScreen').classList.add('hidden');
document.getElementById('adminPanel').classList.remove('hidden');
loadData();
}

async function loadData(){
try{
const url='https://raw.githubusercontent.com/'+GITHUB_USER+'/'+GITHUB_REPO+'/main/'+DATA_FILE;
const res=await fetch(url+'?t='+Date.now());
currentData=await res.json();
renderPanel();
}catch(e){
showMsg('panelMsg','❌ فشل تحميل البيانات: '+e.message,'error');
}
}

function renderPanel(){
document.getElementById('mainImage').value=currentData.site.mainImage||'';
const storeBtn=document.getElementById('storeBtn');
if(currentData.site.storeOpen){
storeBtn.textContent='🟢 المتجر مفتوح - اضغط لإغلاقه';
storeBtn.className='btn-on';
storeBtn.style.width='100%';
}else{
storeBtn.textContent='🔴 المتجر مغلق - اضغط لفتحه';
storeBtn.className='btn-off';
storeBtn.style.width='100%';
}
let mHtml='';
currentData.ministries.forEach((m,i)=>{
mHtml+='<div class="card">';
mHtml+='<div class="card-header"><h3>'+m.name+'</h3><span class="status '+(m.open?'open':'closed')+'">'+(m.open?'✅ مفتوح':'🔒 مقفل')+'</span></div>';
mHtml+='<label>الوصف</label><input type="text" id="m_desc_'+i+'" value="'+m.desc+'">';
mHtml+='<label>رابط الصورة</label><input type="text" id="m_img_'+i+'" value="'+m.img+'">';
mHtml+='<button class="btn-small '+(m.open?'btn-off':'btn-on')+'" onclick="toggleMinistry('+i+')">'+(m.open?'إغلاق':'فتح')+'</button>';
mHtml+='<button class="btn-small" onclick="saveMinistry('+i+')" style="margin-right:8px">💾 حفظ</button>';
mHtml+='</div>';
});
document.getElementById('ministriesList').innerHTML=mHtml;
let pHtml='';
['realestate','packages','gangs'].forEach(cat=>{
const c=currentData.products[cat];
pHtml+='<div class="card"><div class="card-header"><h3>'+c.title+'</h3></div>';
pHtml+='<label>رابط صورة القسم</label><input type="text" id="cat_img_'+cat+'" value="'+c.img+'">';
c.items.forEach((item,idx)=>{
pHtml+='<div style="margin-top:10px;padding:8px;border:1px solid rgba(212,175,55,0.1);border-radius:8px">';
pHtml+='<label>'+item.name+'</label>';
pHtml+='<input type="text" id="item_price_'+cat+'_'+idx+'" value="'+item.price+'" placeholder="السعر">';
pHtml+='</div>';
});
pHtml+='<button onclick="saveProducts(\''+cat+'\')" style="width:100%;margin-top:10px">💾 حفظ منتجات '+c.title+'</button>';
pHtml+='</div>';
});
document.getElementById('productsList').innerHTML=pHtml;
document.getElementById('storeWebhook').value=currentData.webhooks.store||'';
let wHtml='';
currentData.ministries.forEach((m,i)=>{
if(currentData.webhooks.ministries[m.name]!==undefined){
wHtml+='<label>Webhook - '+m.name+'</label>';
wHtml+='<input type="text" id="wh_'+i+'" value="'+currentData.webhooks.ministries[m.name]+'">';
}
});
document.getElementById('ministryWebhooksList').innerHTML=wHtml;
}

async function toggleStore(){
currentData.site.storeOpen=!currentData.site.storeOpen;
try{await saveData();renderPanel();showMsg('panelMsg','✅ تم تحديث حالة المتجر','success');}catch(e){showMsg('panelMsg','❌ فشل الحفظ: '+e.message,'error');}
}

async function toggleMinistry(i){
currentData.ministries[i].open=!currentData.ministries[i].open;
try{await saveData();renderPanel();showMsg('panelMsg','✅ تم تحديث '+currentData.ministries[i].name,'success');}catch(e){showMsg('panelMsg','❌ فشل الحفظ: '+e.message,'error');}
}

async function saveMinistry(i){
currentData.ministries[i].desc=document.getElementById('m_desc_'+i).value;
currentData.ministries[i].img=document.getElementById('m_img_'+i).value;
try{await saveData();showMsg('panelMsg','✅ تم حفظ '+currentData.ministries[i].name,'success');}catch(e){showMsg('panelMsg','❌ فشل الحفظ: '+e.message,'error');}
}

async function saveMainSettings(){
currentData.site.mainImage=document.getElementById('mainImage').value;
try{await saveData();showMsg('panelMsg','✅ تم حفظ إعدادات الموقع','success');}catch(e){showMsg('panelMsg','❌ فشل الحفظ: '+e.message,'error');}
}

async function saveProducts(cat){
currentData.products[cat].img=document.getElementById('cat_img_'+cat).value;
currentData.products[cat].items.forEach((item,idx)=>{
const newPrice=document.getElementById('item_price_'+cat+'_'+idx).value;
if(newPrice)item.price=newPrice;
});
try{await saveData();showMsg('panelMsg','✅ تم حفظ منتجات '+currentData.products[cat].title,'success');}catch(e){showMsg('panelMsg','❌ فشل الحفظ: '+e.message,'error');}
}

async function saveWebhooks(){
currentData.webhooks.store=document.getElementById('storeWebhook').value;
currentData.ministries.forEach((m,i)=>{
const el=document.getElementById('wh_'+i);
if(el)currentData.webhooks.ministries[m.name]=el.value;
});
try{await saveData();showMsg('panelMsg','✅ تم حفظ Webhooks','success');}catch(e){showMsg('panelMsg','❌ فشل الحفظ: '+e.message,'error');}
}

async function saveData(){
const url='https://api.github.com/repos/'+GITHUB_USER+'/'+GITHUB_REPO+'/contents/'+DATA_FILE;
const headers={'Authorization':'Bearer '+githubToken,'Accept':'application/vnd.github+json'};
const getRes=await fetch(url,{headers:headers});
if(!getRes.ok){throw new Error('فشل جلب الملف ('+getRes.status+')');}
const fileInfo=await getRes.json();
const jsonStr=JSON.stringify(currentData,null,2);
const content=btoa(unescape(encodeURIComponent(jsonStr)));
const putRes=await fetch(url,{
method:'PUT',
headers:{...headers,'Content-Type':'application/json'},
body:JSON.stringify({message:'تحديث من لوحة التحكم',content:content,sha:fileInfo.sha})
});
if(!putRes.ok){
const errText=await putRes.text();
throw new Error('فشل الرفع ('+putRes.status+')');
}
}

window.onload=function(){
const saved=localStorage.getItem('gh_token');
if(saved)githubToken=saved;
};
</script>
</body>
</html>
