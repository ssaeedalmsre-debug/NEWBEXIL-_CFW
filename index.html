        .bottom-nav a { color: #666; text-decoration: none; display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; transition: all 0.3s; padding: 5px 10px; border-radius: 8px; }

        .store-card {
            border-radius: 15px;
            padding: 25px 20px;

            color: #fff;

            background-position: center;

            background-image: url('https://cdn.discordapp.com/attachments/1259131362615492658/1539342171147214908/Screenshot_------_com.openai.chatgpt.png?ex=6a85f79d&is=6a84a61d&hm=45866a2a667e4755d312d6af7e032a325001c237c61fe7605c63ba35c8a442fa&');

        }
        .card-packages {
            background-image: url('https://cdn.discordapp.com/attachments/1259131362615492658/1539361981339795497/Screenshot_------_com.openai.chatgpt-3.png?ex=6a860a10&is=6a84b890&hm=ea677e4af8b5a44e9a13351e5dea75848c959e810fc5c3b6b10600cbf086d17e&');
            background-size: cover; background-position: center;
        }
        .card-gangs {
            background-image: url('https://cdn.discordapp.com/attachments/1259131362615492658/1539362866354856036/Screenshot_------_com.openai.chatgpt-2.png?ex=6a860ae3&is=6a84b963&hm=eb1ea33670a84812f9a4a9f8e9900a8669c1ab1a4c4d05066fb9d73958d4764f&');
            background-size: cover; background-position: center;
        }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .product-card {
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
            color: #fff;
            text-align: center;
            background-size: cover;
            background-position: center;
            background-color: transparent;
            border: 2px solid rgba(212,175,55,0.15);
            text-shadow: 0 0 15px rgba(0,0,0,0.9);

        .product-card .quantity-control { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 10px 0; }
        .product-card .quantity-control button { background: rgba(255,255,255,0.05); color: #e0e0e0; border: 1px solid rgba(212,175,55,0.2); border-radius: 5px; width: 30px; height: 30px; font-size: 1rem; cursor: pointer; transition: all 0.3s; }

        .product-card .quantity-control span { font-size: 1.2rem; font-weight: 700; min-width: 30px; color: #e0e0e0; }
        .product-card button.add-btn { background: #d4af37; color: #0a0a0a; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.3s; margin-top: 5px; }
        .product-card button.add-btn:hover { background: #c4a032; transform: scale(1.05); }
        
        .admin-card { background: rgba(20,20,20,0.85); backdrop-filter: blur(5px); border: 1px solid rgba(212,175,55,0.2); border-radius: 12px; padding: 20px; text-align: center; transition: all 0.3s; }
        .admin-card .rank { color: #d4af37; font-weight: 700; font-size: 0.9rem; }
        .admin-card .name { font-size: 1.3rem; font-weight: 700; color: #e0e0e0; }
        
        .law-item {

        }

        .law-section { 
            background: rgba(20,20,20,0.6); 
            border: 1px solid rgba(212,175,55,0.1); 
            border-radius: 12px; 
            padding: 15px 20px; 
            margin-bottom: 20px;
        }
        .law-section h3 { color: #d4af37; font-size: 1.3rem; margin-bottom: 10px; border-bottom: 1px solid rgba(212,175,55,0.15); padding-bottom: 8px; }
        
        .cart-sidebar { position: fixed; top: 0; left: -420px; width: 400px; height: 100%; background: #1a1a1a; backdrop-filter: blur(15px); border-right: 2px solid #d4af37; padding: 20px; z-index: 1000; transition: all 0.4s ease; overflow-y: auto; }
        .cart-sidebar.open { left: 0; }
        .cart-sidebar .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(212,175,55,0.3); padding-bottom: 15px; margin-bottom: 15px; }
        .cart-sidebar .cart-header h3 { color: #d4af37; font-size: 1.5rem; }
        .cart-sidebar .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .cart-sidebar .cart-item .item-info { display: flex; align-items: center; gap: 10px; }
        .cart-sidebar .cart-item .item-info img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
        .cart-sidebar .cart-item .item-info .item-name { color: #e0e0e0; }
        .cart-sidebar .cart-item .item-info .item-qty { color: #777; font-size: 0.8rem; }
        .cart-sidebar .cart-item .item-price { color: #d4af37; }
        .cart-sidebar .cart-total { color: #d4af37; font-size: 1.3rem; font-weight: 700; padding: 15px 0; border-top: 2px solid rgba(212,175,55,0.3); margin-top: 15px; }
        
        .cart-toggle { 
            position: fixed; 
            bottom: 90px; 
            right: 20px; 
            background: #d4af37; 
            color: #0a0a0a; 
            border: none; 
            border-radius: 50%; 
            width: 55px; 
            height: 55px; 
            font-size: 1.5rem; 
            cursor: pointer; 
            box-shadow: 0 0 30px rgba(212,175,55,0.2); 
            transition: all 0.3s; 
            z-index: 500;
            display: none;
        }
        .cart-toggle.visible { display: block; }
        .cart-toggle:hover { transform: scale(1.1); box-shadow: 0 0 50px rgba(212,175,55,0.3); }
        .cart-toggle .badge { position: absolute; top: -5px; right: -5px; background: #d4af37; color: #0a0a0a; border-radius: 50%; width: 22px; height: 22px; font-size: 0.7rem; font-weight: 700; display: flex; justify-content: center; align-items: center; }
        
        .search-bar { display: flex; gap: 10px; max-width: 500px; margin: 20px auto 10px; }
        .search-bar input { flex: 1; background: rgba(255,255,255,0.03); border: 2px solid rgba(212,175,55,0.2); border-radius: 10px; padding: 10px 15px; color: #e0e0e0; font-size: 1rem; }
        .search-bar input:focus { border-color: #d4af37; outline: none; }
        .search-bar button { background: #d4af37; color: #0a0a0a; border: none; border-radius: 10px; padding: 10px 20px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .search-bar button:hover { background: #c4a032; }
        
        .subcategory-tabs { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
        .subcategory-tabs button { background: rgba(255,255,255,0.03); color: #9e9e9e; border: 2px solid rgba(212,175,55,0.1); border-radius: 20px; padding: 6px 16px; cursor: pointer; transition: all 0.3s; }
        .subcategory-tabs button:hover { border-color: #d4af37; color: #e0e0e0; }
        .subcategory-tabs button.active { background: #d4af37; color: #0a0a0a; border-color: #d4af37; }
        
        .product-detail-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .product-detail-modal.show { display: flex; }
        .product-detail-modal .modal-content { background: #1a1a1a; border: 2px solid rgba(212,175,55,0.3); border-radius: 20px; padding: 30px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .product-detail-modal .modal-content .close-btn { float: left; background: none; border: none; color: #e0e0e0; font-size: 1.5rem; cursor: pointer; }
        .product-detail-modal .modal-content .detail-price { color: #d4af37; font-size: 1.5rem; font-weight: 700; }
        .product-detail-modal .modal-content .detail-desc { color: #9e9e9e; margin: 10px 0; }
        .product-detail-modal .modal-content img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        .product-detail-modal .modal-content .quantity-control button { background: rgba(255,255,255,0.05); color: #e0e0e0; border: 1px solid rgba(212,175,55,0.2); border-radius: 5px; width: 30px; height: 30px; font-size: 1rem; cursor: pointer; transition: all 0.3s; }
        .product-detail-modal .modal-content .quantity-control button:hover { background: #d4af37; color: #0a0a0a; }
        .product-detail-modal .modal-content .quantity-control span { color: #e0e0e0; }
        
        .stats-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 15px; }

        .stat-card .stat-number { font-size: 2rem; font-weight: 900; color: #d4af37; }

            background: rgba(20,20,20,0.8); 
            backdrop-filter: blur(5px); 
            border: 2px solid rgba(212,175,55,0.15); 
            border-radius: 12px; 
            padding: 15px; 
            text-align: center; 
            transition: all 0.3s;

            align-items: center;

        .ministry-card .closed { color: #ff4444; font-weight: 700; margin-top: 5px; font-size: 0.9rem; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(30px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes fadeOutDown { from { opacity: 1; transform: translateX(-50%) translateY(0); } to { opacity: 0; transform: translateX(-50%) translateY(30px); } }

<body>

<!-- ===== شاشة الدخول ===== -->
<div id="loginScreen" class="login-screen bg-main">
    <div class="content text-center">
        <img class="logo" src="https://cdn.discordapp.com/attachments/1259131362615492658/1536081187112616086/file_0000000075ec81f4a2f598e0a37d13f8.png?ex=6a7a1a96&is=6a78c916&hm=d5e9dba92e8f19f99c21d3f807a1acb9149689193411752f0dec9ed14585738c&" alt="NEW PIXEL">
        <h1>NEW PIXEL</h1>
        <p class="sub-title">#NEWPIXEL</p>
        <p class="sub-title2">لست الوحيدين لإنتاج فصل</p>
        <p style="color:#9e9e9e;font-size:1rem;margin-bottom:20px;">We are not the only ones but we are the best</p>
        <input type="text" id="usernameInput" class="login-input" placeholder="أدخل اسمك..." value="">
        <button class="login-btn" onclick="loginWithUsername()">دخول 🎉</button>
        <p class="tag">NEW PIXEL</p>
    </div>
</div>

<!-- ===== الموقع الرئيسي ===== -->
<div id="mainSite" style="display:none;" class="bg-main">
    <div class="content">
        <div id="orderBar" class="order-bar">
            <span class="order-number" id="orderNumberDisplay">📋 رقم الطلب: <span id="orderNumberText">0</span></span>
            <div class="order-actions">
                <button class="save-btn" onclick="saveOrderNumber()">💾 حفظ</button>
                <button onclick="removeOrderNumber()">🗑️ إزالة</button>
            </div>
        </div>
        <div id="pageContent"></div>
        <nav class="bottom-nav" id="bottomNav">
            <a href="#" class="active" data-page="home"><i class="fas fa-home"></i><span>الرئيسية</span></a>
            <a href="#" data-page="store"><i class="fas fa-store"></i><span>المتجر</span></a>
            <a href="#" data-page="jobs"><i class="fas fa-briefcase"></i><span>الوظائف</span></a>
            <a href="#" data-page="admin"><i class="fas fa-crown"></i><span>الإدارة</span></a>
            <a href="#" data-page="rules"><i class="fas fa-gavel"></i><span>القوانين</span></a>
            <a href="#" data-page="media"><i class="fas fa-photo-video"></i><span>الميديا</span></a>
            <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt" style="color:#d4af37;"></i><span style="color:#d4af37;">خروج</span></a>
        </nav>
    </div>
</div>

<!-- ===== زر السلة ===== -->
<button class="cart-toggle" id="cartToggle" onclick="toggleCart()">
    🛒 <span class="badge" id="cartBadge">0</span>
</button>

<!-- ===== السلة الجانبية ===== -->
<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h3>🛒 سلة المشتريات</h3>
        <button onclick="toggleCart()" style="background:transparent;border:none;color:#e0e0e0;font-size:1.5rem;cursor:pointer;">✕</button>
    </div>
    <div id="cartItems"><p style="color:#666;text-align:center;padding:20px;">السلة فارغة</p></div>
    <div class="cart-total" id="cartTotal">المجموع: 0 كريدت</div>
    <button onclick="checkout()" style="width:100%;background:#d4af37;color:#0a0a0a;border:none;padding:12px;border-radius:10px;font-weight:700;font-size:1.1rem;cursor:pointer;margin-top:10px;">✅ إنهاء الطلب</button>
</div>

<!-- ===== نافذة تفاصيل المنتج ===== -->
<div class="product-detail-modal" id="productDetailModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeProductDetail()">✕</button>
        <img id="detailImage" src="" alt="">
        <h2 id="detailName" style="color:#e0e0e0;font-size:1.8rem;"></h2>
        <div class="detail-price" id="detailPrice"></div>
        <div class="detail-desc" id="detailDesc">وصف المنتج: منتج مميز وفاخر من NEW PIXEL</div>
        <div class="quantity-control" style="display:flex;justify-content:center;align-items:center;gap:10px;margin:15px 0;">
            <button onclick="changeDetailQty(-1)">-</button>
            <span id="detailQty" style="font-size:1.5rem;font-weight:700;min-width:40px;text-align:center;color:#e0e0e0;">1</span>
            <button onclick="changeDetailQty(1)">+</button>
        </div>
        <button onclick="addDetailToCart()" style="width:100%;background:#d4af37;color:#0a0a0a;border:none;padding:12px;border-radius:10px;font-weight:700;font-size:1.1rem;cursor:pointer;">➕ أضف للسلة</button>
    </div>
</div>

<script>
    // ===== المتغيرات العامة =====
    let currentOrderNumber = '';
    let cart = [];
    let cartCount = 0;

    function loadPage(page) {

        if (pages[page]) {
            content.innerHTML = pages[page]();
            document.querySelectorAll('.bottom-nav a[data-page]').forEach(link => {
                link.classList.remove('active');
                if (link.dataset.page === page) link.classList.add('active');
            });

            } else {
                document.getElementById('cartToggle').classList.remove('visible');

    function renderStore() {

        const tabsContainer = document.getElementById('subcategoryTabs');

        const categoryData = allProducts[currentCategory];
        if (categoryData && tabsContainer) {
            let tabsHtml = `<button class="active" onclick="setSubcategory('all', this)">الكل</button>`;
            categoryData.subcategories.forEach(sub => { tabsHtml += `<button onclick="setSubcategory('${sub}', this)">${sub}</button>`; });
            tabsContainer.innerHTML = tabsHtml;
        }
        let products = categoryData ? [...categoryData.items] : [];
        if (currentSubcategory !== 'all') products = products.filter(p => p.subcategory === currentSubcategory);
        if (searchQuery) products = products.filter(p => p.name.toLowerCase().includes(searchQuery) || p.subcategory.includes(searchQuery));
        if (products.length === 0) { container.innerHTML = `<p style="color:#666;text-align:center;padding:40px;font-size:1.2rem;">❌ لا توجد منتجات تطابق البحث</p>`; return; }
        let html = '';
        products.forEach(p => {
            html += `
                <div class="product-card" style="background-image:url('${p.img}'); position:relative; cursor:pointer;" onclick="openProductDetail('${p.id}')">
                    <h3>${p.name}</h3>
                    <div class="price">💰 ${p.price} كريدت</div>
                    <div class="quantity-control">
                        <button onclick="event.stopPropagation(); changeQty('${p.id}', -1)">-</button>
                        <span id="qty_${p.id}">1</span>
                        <button onclick="event.stopPropagation(); changeQty('${p.id}', 1)">+</button>
                    </div>
                    <button class="add-btn" onclick="event.stopPropagation(); addToCartWithQty('${p.id}')">➕ أضف للسلة</button>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    const tempQtys = {};
    function changeQty(productId, delta) {
        if (!tempQtys[productId]) tempQtys[productId] = 1;
        tempQtys[productId] = Math.max(1, tempQtys[productId] + delta);
        const el = document.getElementById(`qty_${productId}`);
        if (el) el.textContent = tempQtys[productId];
    }
    function getQty(productId) { return tempQtys[productId] || 1; }

    function setSubcategory(sub, btn) {
        currentSubcategory = sub;
        document.querySelectorAll('.subcategory-tabs button').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        renderStore();
    }

    function addToCartWithQty(productId) {
        const categoryData = allProducts[currentCategory];
        const product = categoryData.items.find(p => p.id === productId);
        if (!product) return;
        const qty = getQty(productId);
        addToCart(product, qty);
    }

    function openProductDetail(productId) {
        const categoryData = allProducts[currentCategory];
        const product = categoryData.items.find(p => p.id === productId);
        if (!product) return;
        detailProduct = product;
        detailQty = 1;
        document.getElementById('detailImage').src = product.img;
        document.getElementById('detailName').textContent = product.name;
        document.getElementById('detailPrice').textContent = `💰 ${product.price} كريدت`;
        document.getElementById('detailDesc').textContent = product.desc || 'منتج مميز من NEW PIXEL';
        document.getElementById('detailQty').textContent = 1;
        document.getElementById('productDetailModal').classList.add('show');
    }

    function closeProductDetail() { document.getElementById('productDetailModal').classList.remove('show'); }
    function changeDetailQty(delta) { detailQty = Math.max(1, detailQty + delta); document.getElementById('detailQty').textContent = detailQty; }
    function addDetailToCart() { if (!detailProduct) return; addToCart(detailProduct, detailQty); closeProductDetail(); }

    function addToCart(product, qty) {
        const existing = cart.find(item => item.id === product.id);
        if (existing) { existing.qty += qty; } else { cart.push({ ...product, qty: qty }); }
        cartCount = cart.reduce((sum, item) => sum + item.qty, 0);
        updateCartUI();
        showNotification('➕ تم إضافة ' + product.name + ' (x' + qty + ') للسلة');
    }

    function removeFromCart(index) { cart.splice(index, 1); cartCount = cart.reduce((sum, item) => sum + item.qty, 0); updateCartUI(); }

    function updateCartUI() {
        document.getElementById('cartBadge').textContent = cartCount;
        const container = document.getElementById('cartItems');
        if (cart.length === 0) {
            container.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">السلة فارغة</p>';
            document.getElementById('cartTotal').textContent = 'المجموع: 0 كريدت';
            return;
        }
        let html = '';
        let total = 0;
        cart.forEach((item, index) => {
            const priceNum = parsePrice(item.price);
            const itemTotal = priceNum * item.qty;
            total += itemTotal;
            const priceDisplay = formatPrice(priceNum);
            const totalDisplay = formatPrice(itemTotal);
            html += `
                <div class="cart-item">
                    <div class="item-info">
                        <img src="${item.img}" alt="">
                        <div>
                            <div class="item-name">${item.name}</div>
                            <div class="item-qty">الكمية: ${item.qty}</div>
                            <div style="color:#777;font-size:0.7rem;">السعر: ${priceDisplay} كريدت</div>
                        </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <span class="item-price">${totalDisplay} كريدت</span>
                        <button onclick="removeFromCart(${index})" style="background:#d4af37;color:#0a0a0a;border:none;border-radius:5px;padding:2px 10px;cursor:pointer;">✕</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        document.getElementById('cartTotal').textContent = 'المجموع: ' + formatPrice(total) + ' كريدت';
    }

    function toggleCart() { document.getElementById('cartSidebar').classList.toggle('open'); }

    function checkout() {
        if (cart.length === 0) { alert('السلة فارغة!'); return; }
        const orderNumber = Math.floor(Math.random() * 1000000);
        showOrderNumber(orderNumber);
        let total = 0;
        let itemsList = '';
        cart.forEach(item => { const priceNum = parsePrice(item.price); total += priceNum * item.qty; itemsList += `${item.name} (x${item.qty}) - ${item.price}\n`; });
        const orderData = { username: currentUser || 'زائر', orderNumber: orderNumber, items: itemsList || 'لا يوجد', total: formatPrice(total) + ' كريدت' };
        sendDiscordNotification(orderData);
        storeStats.sales += cart.reduce((sum, item) => sum + item.qty, 0);
        cart = [];
        cartCount = 0;
        updateCartUI();
        toggleCart();
        showNotification('✅ تم إنهاء الطلب بنجاح! رقم الطلب: #' + orderNumber);
    }

    function getRulesPage() {
        let lawsHtml = '';
        laws.forEach(section => {
            let rulesHtml = '';
            section.rules.forEach((rule, index) => { rulesHtml += `<div class="law-item"><strong>${index + 1}.</strong> ${rule}</div>`; });
            lawsHtml += `<div class="law-section"><h3>📜 ${section.title}</h3>${rulesHtml}</div>`;
        });
        return `
            <section class="section">
                <h2 class="section-title">📜 قوانين السيرفر</h2>
                <div class="card-dark" style="max-width:900px;margin:0 auto;">
                    <p style="color:#d4af37;text-align:center;font-size:1.1rem;margin-bottom:20px;">يرجى قراءة القوانين بعناية قبل الانضمام</p>
                    <p style="color:#9e9e9e;text-align:center;margin-bottom:20px;">الالتزام بالقوانين إلزامي لجميع اللاعبين.</p>
                    ${lawsHtml}
                </div>
            </section>
        `;
    }

    function getJobsPage() {
        let ministriesHtml = '';
        ministries.forEach(m => {
            ministriesHtml += `
                <div class="ministry-card">
                    <img src="${m.img}" alt="${m.name}" loading="lazy">
                    <h3>${m.name}</h3>
                    <div class="desc">${m.desc}</div>
                    <div class="closed">🔒 غير مفعل</div>
                </div>
            `;
        });
        return `
            <section class="section">
                <h2 class="section-title">💼 الوظائف والوزارات</h2>
                <div class="card-dark" style="max-width:1000px;margin:0 auto;text-align:center;">
                    <p style="font-size:1.2rem;color:#d4af37;">🏛️ وزارات الدولة</p>
                    <p style="color:#9e9e9e;margin-bottom:15px;">انضم إلى إحدى الوزارات للمساهمة في تطوير السيرفر</p>
                    <div class="ministry-grid">${ministriesHtml}</div>
                    <p style="color:#666;margin-top:20px;font-size:0.9rem;">⚠️ جميع الوزارات حالياً غير مفعلة - قريباً سيفتح باب التقديم</p>
                </div>
            </section>
        `;
    }

    function getAdminPage() {
        return `
            <section class="section">
                <h2 class="section-title">👑 الإدارة</h2>
                <div class="admin-card" style="max-width:400px;margin:0 auto;">
                    <p style="color:#666;font-size:1.2rem;">🚧 قائمة الإدارة قيد التحديث</p>
                    <p style="color:#888;font-size:0.9rem;">سيتم الإعلان عن الطاقم الإداري قريباً</p>
                </div>
            </section>
        `;
    }

    function getMediaPage() {
        return `
            <section class="section">
                <h2 class="section-title">📸 الميديا</h2>
                <div class="card-dark" style="max-width:800px;margin:0 auto;text-align:center;">
                    <p style="color:#d4af37;font-size:1.3rem;">✅ قريباً - محتوى حصري من السيرفر</p>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-top:20px;">
                        <div style="background:rgba(212,175,55,0.05);border-radius:10px;padding:15px;border:1px solid rgba(212,175,55,0.1);">
                            <i class="fab fa-youtube" style="font-size:2rem;color:#ff0000;"></i>
                            <p style="color:#9e9e9e;">يوتيوب</p>
                        </div>
                        <div style="background:rgba(212,175,55,0.05);border-radius:10px;padding:15px;border:1px solid rgba(212,175,55,0.1);">
                            <i class="fab fa-tiktok" style="font-size:2rem;color:#000;"></i>
                            <p style="color:#9e9e9e;">تيك توك</p>
                        </div>
                        <div style="background:rgba(212,175,55,0.05);border-radius:10px;padding:15px;border:1px solid rgba(212,175,55,0.1);">
                            <i class="fab fa-instagram" style="font-size:2rem;color:#e4405f;"></i>
                            <p style="color:#9e9e9e;">انستغرام</p>
                        </div>
                    </div>
                </div>
            </section>
        `;
    }

    function showNotification(msg) {
        const old = document.querySelector('.notification-toast');
        if (old) old.remove();
        const div = document.createElement('div');
        div.className = 'notification-toast';
        div.style.cssText = 'position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#e0e0e0;padding:12px 25px;border-radius:10px;border:1px solid #d4af37;z-index:2000;font-size:1rem;animation:fadeInUp 0.5s ease;';
        div.textContent = msg;
        document.body.appendChild(div);
        setTimeout(() => { div.style.animation = 'fadeOutDown 0.5s ease'; setTimeout(() => div.remove(), 500); }, 3000);
    }

    window.onload = function() {
        try {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && user.username) {
                currentUser = user.username;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainSite').style.display = 'block';
                loadPage('home');
                storeStats.visitors++;
            }
        } catch(e) {}
    };
</script>

</body>
</html>
